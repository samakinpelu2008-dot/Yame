<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikBoost - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#0b1220;--card:#111827;--primary:#2563eb;--success:#22c55e;--danger:#ef4444;--text:#e5e7eb;--muted:#9ca3af;
}
body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:var(--bg);color:var(--text);}
.container{max-width:430px;margin:auto;padding:16px;}
.card{background:var(--card);padding:16px;border-radius:14px;margin-bottom:16px;}
input,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none;}
input{background:#020617;color:var(--text);}
button{background:var(--primary);color:#fff;font-weight:600;}
button.success{background:var(--success);}
button.danger{background:var(--danger);}
button:disabled{opacity:.5;}
.hidden{display:none;}
ul{padding-left:18px;}
li{margin-bottom:8px;font-size:14px;}
</style>
</head>
<body>
<div class="container">

<!-- ADMIN AUTH -->
<div id="auth" class="card">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="authBtn">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden card">
  <h3>Admin Panel</h3>

  <h4>Users</h4>
  <ul id="adminUsers"></ul>

  <h4>Payments</h4>
  <ul id="adminPayments"></ul>

  <h4>Posts</h4>
  <ul id="adminPosts"></ul>

  <button id="logoutBtn">Logout</button>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, getDoc, getDocs, collection, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

let currentUser = null;

const authDiv = document.getElementById('auth');
const adminPanel = document.getElementById('adminPanel');
const authBtn = document.getElementById('authBtn');
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');

authBtn.onclick = async () => {
  const email = emailInput.value;
  const pass = passInput.value;
  const res = await signInWithEmailAndPassword(auth,email,pass);
  const snap = await getDoc(doc(db,"users",res.user.uid));
  if(snap.data().role!=="admin") {alert("Not admin"); await signOut(auth); return;}
};

onAuthStateChanged(auth,async user=>{
  if(!user) return;
  currentUser = user;
  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.data().role!=="admin") {alert("Not admin"); await signOut(auth); return;}
  authDiv.classList.add('hidden');
  adminPanel.classList.remove('hidden');
  loadUsers();
  loadPayments();
  loadPosts();
});

document.getElementById('logoutBtn').onclick=()=>signOut(auth);

/* ====== USERS ====== */
async function loadUsers(){
  const list=document.getElementById('adminUsers');
  list.innerHTML="";
  const snaps = await getDocs(collection(db,"users"));
  snaps.forEach(d=>{
    const u=d.data();
    const li = document.createElement("li");
    li.innerHTML=`${u.email} | ${u.pts} PTS
    <button onclick="banUser('${d.id}')">Ban</button>
    <button onclick="addPts('${d.id}')">+PTS</button>`;
    list.appendChild(li);
  });
}

window.banUser=async id=>{
  const ref=doc(db,"users",id);
  const snap = await getDoc(ref);
  await updateDoc(ref,{banned:!snap.data().banned});
  loadUsers();
};

window.addPts=async id=>{
  const amt=prompt("Add points:");
  if(!amt) return;
  const ref=doc(db,"users",id);
  const snap=await getDoc(ref);
  await updateDoc(ref,{pts:snap.data().pts+Number(amt)});
  loadUsers();
};

/* ====== PAYMENTS ====== */
async function loadPayments(){
  const list=document.getElementById('adminPayments');
  list.innerHTML="";
  const q=query(collection(db,"payments"),where("status","==","pending"));
  const snaps = await getDocs(q);
  snaps.forEach(d=>{
    const p=d.data();
    const li=document.createElement("li");
    li.innerHTML=`${p.uid} | ${p.amount} PTS
    <button onclick="approvePayment('${d.id}','${p.uid}','${p.amount}')">Approve</button>`;
    list.appendChild(li);
  });
}

window.approvePayment=async(pid,uid,amt)=>{
  const refPay=doc(db,"payments",pid);
  await updateDoc(refPay,{status:"approved"});
  const refUser=doc(db,"users",uid);
  const snap=await getDoc(refUser);
  await updateDoc(refUser,{pts:snap.data().pts+Number(amt)});
  loadPayments();
  loadUsers();
};

/* ====== POSTS ====== */
async function loadPosts(){
  const list=document.getElementById('adminPosts');
  list.innerHTML="";
  const snaps = await getDocs(collection(db,"posts"));
  snaps.forEach(d=>{
    const p=d.data();
    const li=document.createElement("li");
    li.innerHTML=`${p.uid} | ${p.link} | ${p.plan} Likes
    <button onclick="deletePost('${d.id}')">Delete</button>`;
    list.appendChild(li);
  });
}

window.deletePost=async id=>{
  await deleteDoc(doc(db,"posts",id));
  loadPosts();
};
</script>
</body>
</html>
