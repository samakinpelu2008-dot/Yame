<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Crossword Puzzle</title>
<style>
  body { font-family: sans-serif; background:#f0f0f0; display:flex; flex-direction:column; align-items:center; padding:20px; }
  table { border-collapse: collapse; }
  td { border: 1px solid #000; width: 30px; height: 30px; text-align: center; vertical-align: middle; }
  input { width: 28px; height: 28px; text-transform: uppercase; text-align:center; border:none; font-weight:bold; font-size:16px; }
  input:disabled { background: #333; }
  #checkBtn { margin-top: 15px; padding:8px 15px; font-size:16px; }
</style>
</head>
<body>

<h2>Simple Crossword Puzzle</h2>
<table id="crossword"></table>
<button id="checkBtn">Check Answers</button>

<script>
// ===== CROSSWORD GRID SETUP =====
// '.' = empty cell / black
// letters = solution
const crosswordData = [
  ['C','A','T','.','D','O','G'],
  ['.','.','A','.','.','.','O'],
  ['F','I','S','H','.','.','G'],
  ['.','.','R','.','.','.','.'],
  ['.','.','E','.','.','.','.']
];

const table = document.getElementById('crossword');
const inputCells = [];

for(let i=0;i<crosswordData.length;i++){
  const row = document.createElement('tr');
  inputCells[i] = [];
  for(let j=0;j<crosswordData[i].length;j++){
    const td = document.createElement('td');
    if(crosswordData[i][j]==='.'){
      td.style.background='#333';
      const input = document.createElement('input');
      input.disabled = true;
      td.appendChild(input);
    } else {
      const input = document.createElement('input');
      input.maxLength = 1;
      inputCells[i][j] = input;
      td.appendChild(input);
    }
    row.appendChild(td);
  }
  table.appendChild(row);
}

// ====== CHECK ANSWERS ======
document.getElementById('checkBtn').addEventListener('click',()=>{
  let correct = 0;
  let total = 0;
  for(let i=0;i<crosswordData.length;i++){
    for(let j=0;j<crosswordData[i].length;j++){
      if(crosswordData[i][j]!=='.'){
        total++;
        if(inputCells[i][j].value.toUpperCase() === crosswordData[i][j]){
          inputCells[i][j].style.background='lightgreen';
          correct++;
        } else {
          inputCells[i][j].style.background='pink';
        }
      }
    }
  }
  alert(`You got ${correct} out of ${total} correct!`);
});
</script>

</body>
</html>
