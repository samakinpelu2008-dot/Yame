<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikBoost - User</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#0b1220;--card:#111827;--primary:#2563eb;--success:#22c55e;--text:#e5e7eb;--muted:#9ca3af;
}
body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:var(--bg);color:var(--text);}
.container{max-width:430px;margin:auto;padding:16px;}
.card{background:var(--card);padding:16px;border-radius:14px;margin-bottom:16px;}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none;}
input,select{background:#020617;color:var(--text);}
button{background:var(--primary);color:#fff;font-weight:600;}
button.success{background:var(--success);}
button:disabled{opacity:.5;}
small{display:block;text-align:center;margin-top:10px;color:var(--muted);}
small span{color:var(--primary);cursor:pointer;}
.hidden{display:none;}
.header{display:flex;justify-content:space-between;align-items:center;}
.balance{background:#020617;padding:10px 14px;border-radius:12px;font-weight:700;}
.task{display:flex;gap:8px;margin-top:8px;}
.task button{flex:1}
</style>
</head>
<body>
<div class="container">

<!-- AUTH -->
<div id="auth" class="card">
  <h2 id="authTitle">Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="authBtn">Login</button>
  <small id="toggleText">Don’t have an account? <span id="toggleLink">Sign up</span></small>
</div>

<!-- RULES -->
<div id="rules" class="card hidden">
  <h3>Rules</h3>
  <p>• Perform tasks manually<br>• Stay on TikTok ≥3 seconds<br>• No cheating or spam<br>• Abuse = ban</p>
  <button id="acceptRules" disabled>Accept (5)</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
  <div class="card header">
    <div><strong id="userEmail"></strong><p>User Dashboard</p></div>
    <div class="balance"><span id="pts">0</span> PTS</div>
  </div>

  <div class="card">
    <h4>Daily Reward</h4>
    <button class="success" id="dailyBtn">Claim +5 PTS</button>
  </div>

  <div class="card">
    <h4>Tasks</h4>
    <div class="task">
      <button id="openLike">Like Video (+1)</button>
      <button id="confirmLike" disabled>Confirm</button>
    </div>
  </div>

  <div class="card">
    <h4>Post Video</h4>
    <input id="videoLink" placeholder="TikTok video link">
    <select id="likePlan">
      <option value="100">100 Likes – 100 PTS</option>
      <option value="200">200 Likes – 190 PTS</option>
      <option value="500">500 Likes – 460 PTS</option>
      <option value="1000">1000 Likes – 900 PTS</option>
    </select>
    <button id="postBtn">Submit</button>
  </div>

  <div class="card">
    <h4>Buy Points (Manual)</h4>
    <p>₦10 = 1 PTS<br>Transfer & submit reference</p>
    <input id="buyAmount" placeholder="PTS amount">
    <input id="buyRef" placeholder="Payment reference">
    <button id="payBtn">Submit</button>
  </div>

  <button class="secondary" id="logoutBtn">Logout</button>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, setDoc, getDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

let signup = false;
let currentUser = null;

const authTitle = document.getElementById('authTitle');
const authBtn = document.getElementById('authBtn');
const toggleLink = document.getElementById('toggleLink');
const toggleText = document.getElementById('toggleText');
const rulesDiv = document.getElementById('rules');
const acceptRules = document.getElementById('acceptRules');
const dashDiv = document.getElementById('dash');
const userEmail = document.getElementById('userEmail');
const ptsEl = document.getElementById('pts');
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');

toggleLink.onclick = () => {
  signup = !signup;
  authTitle.innerText = signup ? "Sign Up" : "Login";
  authBtn.innerText = signup ? "Sign Up" : "Login";
  toggleText.innerHTML = signup ? `Already have an account? <span id="toggleLink">Login</span>` : `Don’t have an account? <span id="toggleLink">Sign up</span>`;
};

authBtn.onclick = async () => {
  const email = emailInput.value;
  const pass = passInput.value;
  if(!email || !pass) return alert("Fill all fields");

  if(signup){
    const res = await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",res.user.uid),{
      email,
      pts:0,
      role:"user",
      banned:false,
      lastDaily:""
    });
  } else {
    await signInWithEmailAndPassword(auth,email,pass);
  }
};

onAuthStateChanged(auth,async user=>{
  if(!user) return;
  currentUser=user;
  document.getElementById('auth').classList.add('hidden');
  rulesDiv.classList.remove('hidden');

  let c=5;
  const t=setInterval(()=>{
    acceptRules.innerText=`Accept (${c})`;
    c--;
    if(c<0){clearInterval(t);acceptRules.innerText="Accept";acceptRules.disabled=false;}
  },1000);

  acceptRules.onclick=async()=>{
    rulesDiv.classList.add('hidden');
    dashDiv.classList.remove('hidden');
    const snap = await getDoc(doc(db,"users",user.uid));
    ptsEl.innerText=snap.data().pts;
    userEmail.innerText=snap.data().email;
  };
});

// Dashboard actions
document.getElementById('openLike').onclick=()=>{
  window.open("https://tiktok.com","_blank");
  document.getElementById('confirmLike').disabled=true;
  setTimeout(()=>document.getElementById('confirmLike').disabled=false,3000);
};

document.getElementById('confirmLike').onclick=async()=>{
  const ref=doc(db,"users",currentUser.uid);
  const snap=await getDoc(ref);
  await updateDoc(ref,{pts:snap.data().pts+1});
  ptsEl.innerText=snap.data().pts+1;
  document.getElementById('confirmLike').disabled=true;
};

document.getElementById('dailyBtn').onclick=async()=>{
  const ref=doc(db,"users",currentUser.uid);
  const snap=await getDoc(ref);
  const today=new Date().toDateString();
  if(snap.data().lastDaily===today) return alert("Already claimed today");
  await updateDoc(ref,{pts:snap.data().pts+5,lastDaily:today});
  ptsEl.innerText=snap.data().pts+5;
};

document.getElementById('postBtn').onclick=async()=>{
  await addDoc(collection(db,"posts"),{
    uid:currentUser.uid,
    link:document.getElementById('videoLink').value,
    plan:document.getElementById('likePlan').value
  });
  alert("Video posted");
};

document.getElementById('payBtn').onclick=async()=>{
  await addDoc(collection(db,"payments"),{
    uid:currentUser.uid,
    amount:document.getElementById('buyAmount').value,
    ref:document.getElementById('buyRef').value,
    status:"pending"
  });
  alert("Payment submitted");
};

document.getElementById('logoutBtn').onclick=()=>signOut(auth);
</script>
</body>
</html>
