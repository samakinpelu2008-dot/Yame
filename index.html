<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikBoost</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --primary:#2563eb;
  --success:#22c55e;
  --danger:#ef4444;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:430px;
  margin:auto;
  padding:16px;
}
.card{
  background:var(--card);
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
}
h2,h3,h4{margin:0 0 10px}
p{color:var(--muted);font-size:14px}
input,select,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:8px;
}
input,select{
  background:#020617;
  color:var(--text);
}
button{
  background:var(--primary);
  color:#fff;
  font-weight:600;
}
button.success{background:var(--success)}
button.danger{background:var(--danger)}
button.secondary{background:#334155}
button:disabled{opacity:.5}
small{
  display:block;
  text-align:center;
  margin-top:10px;
  color:var(--muted);
}
small span{
  color:var(--primary);
  cursor:pointer;
}
.hidden{display:none}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.balance{
  background:#020617;
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
}
.task{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.task button{flex:1}
ul{padding-left:18px}
li{margin-bottom:6px;font-size:14px}
</style>
</head>

<body>
<div class="container">

<!-- AUTH -->
<div id="auth" class="card">
  <h2 id="authTitle">Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="authBtn">Login</button>
  <small id="toggleText">
    Don’t have an account? <span id="toggleLink">Sign up</span>
  </small>
</div>

<!-- RULES -->
<div id="rules" class="card hidden">
  <h3>Rules</h3>
  <p>
    • Perform tasks manually<br>
    • Stay on TikTok for at least 3 seconds<br>
    • No cheating or spam<br>
    • Abuse = ban
  </p>
  <button id="acceptRules" disabled>Accept (5)</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">

  <div class="card header">
    <div>
      <strong id="userEmail"></strong>
      <p>User Dashboard</p>
    </div>
    <div class="balance"><span id="pts">0</span> PTS</div>
  </div>

  <div class="card">
    <h4>Daily Reward</h4>
    <button class="success" id="dailyBtn">Claim +5 PTS</button>
  </div>

  <div class="card">
    <h4>Tasks</h4>
    <div class="task">
      <button id="openLike">Like Video (+1)</button>
      <button id="confirmLike" disabled>Confirm</button>
    </div>
  </div>

  <div class="card">
    <h4>Post Video</h4>
    <input id="videoLink" placeholder="TikTok video link">
    <select id="likePlan">
      <option value="100">100 Likes – 100 PTS</option>
      <option value="200">200 Likes – 190 PTS</option>
      <option value="500">500 Likes – 460 PTS</option>
      <option value="1000">1000 Likes – 900 PTS</option>
    </select>
    <button id="postBtn">Submit</button>
  </div>

  <div class="card">
    <h4>Buy Points (Manual)</h4>
    <p>₦10 = 1 PTS<br>Transfer & submit reference</p>
    <input id="buyAmount" placeholder="PTS amount">
    <input id="buyRef" placeholder="Payment reference">
    <button id="payBtn">Submit</button>
  </div>

  <button class="secondary" id="logoutBtn">Logout</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden card">
  <h3>Admin Panel</h3>

  <h4>Users</h4>
  <ul id="adminUsers"></ul>

  <h4>Payments</h4>
  <ul id="adminPayments"></ul>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBEOlLBZvTRxjzxBal9HstvnU2121TXzJg",
  authDomain: "storyverse-2dd65.firebaseapp.com",
  projectId: "storyverse-2dd65",
  storageBucket: "storyverse-2dd65.appspot.com",
  messagingSenderId: "547979964176",
  appId: "1:547979964176:web:c4b54dce44caee07ab3f95"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let signup = false;
let currentUser = null;

toggleLink.onclick = () => {
  signup = !signup;
  authTitle.innerText = signup ? "Sign Up" : "Login";
  authBtn.innerText = signup ? "Sign Up" : "Login";
  toggleText.innerHTML = signup
    ? `Already have an account? <span id="toggleLink">Login</span>`
    : `Don’t have an account? <span id="toggleLink">Sign up</span>`;
};

authBtn.onclick = async () => {
  if (signup) {
    const res = await createUserWithEmailAndPassword(auth, email.value, password.value);
    await setDoc(doc(db, "users", res.user.uid), {
      email: email.value,
      pts: 0,
      role: "user",
      banned: false,
      lastDaily: ""
    });
  } else {
    await signInWithEmailAndPassword(auth, email.value, password.value);
  }
};

onAuthStateChanged(auth, async user => {
  if (!user) return;
  currentUser = user;
  auth.classList.add("hidden");
  rules.classList.remove("hidden");

  let c = 5;
  const t = setInterval(() => {
    acceptRules.innerText = `Accept (${c})`;
    c--;
    if (c < 0) {
      clearInterval(t);
      acceptRules.innerText = "Accept";
      acceptRules.disabled = false;
    }
  }, 1000);

  acceptRules.onclick = async () => {
    rules.classList.add("hidden");
    dash.classList.remove("hidden");
    const snap = await getDoc(doc(db,"users",user.uid));
    pts.innerText = snap.data().pts;
    userEmail.innerText = snap.data().email;
    if (snap.data().role === "admin") adminPanel.classList.remove("hidden");
  };
});

openLike.onclick = () => {
  window.open("https://tiktok.com","_blank");
  confirmLike.disabled = true;
  setTimeout(()=>confirmLike.disabled=false,3000);
};

confirmLike.onclick = async () => {
  const ref = doc(db,"users",currentUser.uid);
  const snap = await getDoc(ref);
  await updateDoc(ref,{pts:snap.data().pts+1});
  pts.innerText = snap.data().pts+1;
};

dailyBtn.onclick = async () => {
  const ref = doc(db,"users",currentUser.uid);
  const snap = await getDoc(ref);
  const today = new Date().toDateString();
  if (snap.data().lastDaily === today) return alert("Already claimed");
  await updateDoc(ref,{pts:snap.data().pts+5,lastDaily:today});
  pts.innerText = snap.data().pts+5;
};

postBtn.onclick = async () => {
  await addDoc(collection(db,"posts"),{
    uid:currentUser.uid,
    link:videoLink.value,
    plan:likePlan.value
  });
  alert("Posted");
};

payBtn.onclick = async () => {
  await addDoc(collection(db,"payments"),{
    uid:currentUser.uid,
    amount:buyAmount.value,
    ref:buyRef.value,
    status:"pending"
  });
  alert("Submitted");
};

logoutBtn.onclick = ()=>signOut(auth);
</script>

</body>
</html>
