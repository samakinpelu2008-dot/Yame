<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  addDoc,
  collection,
  getDocs,
  query,
  where,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (YOURS) */
const firebaseConfig = {
  apiKey: "AIzaSyBEOlLBZvTRxjzxBal9HstvnU2121TXzJg",
  authDomain: "storyverse-2dd65.firebaseapp.com",
  projectId: "storyverse-2dd65",
  storageBucket: "storyverse-2dd65.appspot.com",
  messagingSenderId: "547979964176",
  appId: "1:547979964176:web:c4b54dce44caee07ab3f95"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let currentUser = null;
let isSignup = false;
let activeTask = null;

/* 🔁 AUTH TOGGLE */
window.toggleAuth = () => {
  isSignup = !isSignup;
  document.getElementById("authTitle").innerText = isSignup ? "Sign Up" : "Login";
  document.getElementById("authBtn").innerText = isSignup ? "Sign Up" : "Login";
  document.getElementById("toggleText").innerHTML = isSignup
    ? `Already have an account? <span onclick="toggleAuth()">Login</span>`
    : `Don’t have an account? <span onclick="toggleAuth()">Sign up</span>`;
};

/* 🔐 AUTH HANDLER */
window.handleAuth = async () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) return alert("Fill all fields");

  if (isSignup) {
    const res = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", res.user.uid), {
      email,
      pts: 0,
      trust: 100,
      banned: false,
      role: "user",
      lastDaily: 0
    });
  } else {
    await signInWithEmailAndPassword(auth, email, pass);
  }
};

/* 👤 AUTH STATE */
onAuthStateChanged(auth, async user => {
  if (!user) return;
  currentUser = user;

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("rules").classList.remove("hidden");

  let count = 5;
  const btn = document.getElementById("acceptRules");
  btn.disabled = true;

  const timer = setInterval(() => {
    btn.innerText = `Accept (${count})`;
    count--;
    if (count < 0) {
      clearInterval(timer);
      btn.innerText = "Accept";
      btn.disabled = false;
    }
  }, 1000);

  btn.onclick = () => {
    document.getElementById("rules").classList.add("hidden");
    loadDashboard();
  };
});

/* 🧠 LOAD DASHBOARD */
async function loadDashboard() {
  const snap = await getDoc(doc(db, "users", currentUser.uid));
  const data = snap.data();

  if (data.banned) return alert("Account banned");

  document.getElementById("dash").classList.remove("hidden");
  document.getElementById("userEmail").innerText = data.email;
  document.getElementById("pts").innerText = data.pts;

  if (data.role === "admin") {
    document.getElementById("adminPanel").classList.remove("hidden");
    loadAdmin();
  }
}

/* ⏱ TASK SYSTEM */
window.startLikeTask = () => {
  activeTask = "like";
  window.open("https://www.tiktok.com", "_blank");
  document.getElementById("confirmLike").disabled = true;
  setTimeout(() => {
    document.getElementById("confirmLike").disabled = false;
  }, 3000);
};

window.confirmLikeTask = async () => {
  if (!activeTask) return;

  const ref = doc(db, "users", currentUser.uid);
  const snap = await getDoc(ref);

  await updateDoc(ref, { pts: snap.data().pts + 1 });
  document.getElementById("pts").innerText = snap.data().pts + 1;
  activeTask = null;
  document.getElementById("confirmLike").disabled = true;
};

/* 🎁 DAILY REWARD */
window.dailyReward = async () => {
  const ref = doc(db, "users", currentUser.uid);
  const snap = await getDoc(ref);
  const today = new Date().toDateString();

  if (snap.data().lastDaily === today) {
    return alert("Already claimed today");
  }

  await updateDoc(ref, {
    pts: snap.data().pts + 5,
    lastDaily: today
  });

  document.getElementById("pts").innerText = snap.data().pts + 5;
};

/* 📤 POST VIDEO */
window.postVideo = async () => {
  const link = document.getElementById("videoLink").value;
  const plan = Number(document.getElementById("likePlan").value);
  const cost = plan === 100 ? 100 : plan === 200 ? 190 : plan === 500 ? 460 : 900;

  const ref = doc(db, "users", currentUser.uid);
  const snap = await getDoc(ref);

  if (snap.data().pts < cost) return alert("Not enough points");

  await updateDoc(ref, { pts: snap.data().pts - cost });
  document.getElementById("pts").innerText = snap.data().pts - cost;

  await addDoc(collection(db, "posts"), {
    uid: currentUser.uid,
    link,
    target: plan,
    done: 0,
    status: "active"
  });

  alert("Video posted");
};

/* 💰 MANUAL PAYMENT */
window.submitPayment = async () => {
  await addDoc(collection(db, "payments"), {
    uid: currentUser.uid,
    amount: document.getElementById("buyAmount").value,
    ref: document.getElementById("buyRef").value,
    status: "pending"
  });
  alert("Payment submitted");
};

/* 🚪 LOGOUT */
window.logout = () => signOut(auth);

/* ========================= */
/* ===== ADMIN PANEL ======= */
/* ========================= */

async function loadAdmin() {
  loadUsers();
  loadPayments();
}

/* 👥 USERS */
async function loadUsers() {
  const list = document.getElementById("adminUsers");
  list.innerHTML = "";

  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const u = d.data();
    list.innerHTML += `
      <li>
        ${u.email} | ${u.pts} PTS
        <button onclick="banUser('${d.id}')">Ban</button>
        <button onclick="addPts('${d.id}')">+PTS</button>
      </li>`;
  });
}

window.banUser = async id => {
  await updateDoc(doc(db, "users", id), { banned: true });
  loadUsers();
};

window.addPts = async id => {
  const amt = prompt("Add points:");
  const ref = doc(db, "users", id);
  const snap = await getDoc(ref);
  await updateDoc(ref, { pts: snap.data().pts + Number(amt) });
  loadUsers();
};

/* 💳 PAYMENTS */
async function loadPayments() {
  const list = document.getElementById("adminPayments");
  list.innerHTML = "";

  const snap = await getDocs(query(collection(db, "payments"), where("status", "==", "pending")));
  snap.forEach(d => {
    const p = d.data();
    list.innerHTML += `
      <li>
        ${p.uid} | ${p.amount} PTS
        <button onclick="approvePay('${d.id}', '${p.uid}', ${p.amount})">Approve</button>
      </li>`;
  });
}

window.approvePay = async (pid, uid, amt) => {
  await updateDoc(doc(db, "payments", pid), { status: "approved" });
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  await updateDoc(ref, { pts: snap.data().pts + Number(amt) });
  loadPayments();
  loadUsers();
};
        </script>
