<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>5v5 Circle Battle Game</title>
<style>
  body { margin:0; background:#222; display:flex; justify-content:center; align-items:center; height:100vh; color:white; font-family:sans-serif; flex-direction:column; }
  canvas { background:#333; border:2px solid #fff; }
  #scoreboard { margin-bottom:10px; font-size:20px; }
</style>
</head>
<body>
<div id="scoreboard">Red: 0 | Blue: 0</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const radius = 20;
const speed = 5;
let turn = 'player';
let moveInProgress = false;
let redScore = 0;
let blueScore = 0;
const winScore = 5;

// ====== CREATE TEAMS ======
let players = [];
let aiTeam = [];

for(let i=0;i<5;i++){
  players.push({x:50+i*50, y:450, targetX:50+i*50, targetY:450, alive:true});
  aiTeam.push({x:50+i*50, y:50, targetX:50+i*50, targetY:50, alive:true});
}

// ====== DRAW ======
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of players){
    if(!p.alive) continue;
    ctx.beginPath();
    ctx.arc(p.x,p.y,radius,0,Math.PI*2);
    ctx.fillStyle='red';
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.stroke();
  }

  for(let a of aiTeam){
    if(!a.alive) continue;
    ctx.beginPath();
    ctx.arc(a.x,a.y,radius,0,Math.PI*2);
    ctx.fillStyle='blue';
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.stroke();
  }
}

// ====== MOVE ANIMATION ======
function animateMovement(){
  let moving = false;

  function moveUnit(u){
    if(!u.alive) return;
    let dx = u.targetX - u.x;
    let dy = u.targetY - u.y;
    if(Math.abs(dx)>0.5){ u.x += dx*0.2; moving = true; }
    if(Math.abs(dy)>0.5){ u.y += dy*0.2; moving = true; }
  }

  players.forEach(moveUnit);
  aiTeam.forEach(moveUnit);

  if(!moving && moveInProgress){
    moveInProgress = false;
    checkAttack();
    if(turn==='player') turn='ai';
    else turn='player';

    if(turn==='ai') aiMove();
  }
}

// ====== CHECK ATTACKS ======
function checkAttack(){
  for(let p of players){
    if(!p.alive) continue;
    for(let a of aiTeam){
      if(!a.alive) continue;
      let dist = Math.hypot(p.x-a.x, p.y-a.y);
      if(dist <= radius*2){
        // attack
        a.alive=false;
        redScore++;
        updateScore();
      }
    }
  }

  for(let a of aiTeam){
    if(!a.alive) continue;
    for(let p of players){
      if(!p.alive) continue;
      let dist = Math.hypot(a.x-p.x, a.y-p.y);
      if(dist <= radius*2){
        p.alive=false;
        blueScore++;
        updateScore();
      }
    }
  }

  // Check win
  if(redScore>=winScore || blueScore>=winScore){
    alert((redScore>=winScore?'Red':'Blue') + ' wins!');
    resetGame();
  }
}

// ====== UPDATE SCOREBOARD ======
function updateScore(){
  document.getElementById('scoreboard').innerText = `Red: ${redScore} | Blue: ${blueScore}`;
}

// ====== PLAYER CLICK ======
canvas.addEventListener('click', (e)=>{
  if(turn!=='player' || moveInProgress) return;

  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  // nearest alive player
  let alivePlayers = players.filter(p=>p.alive);
  if(alivePlayers.length===0) return;

  let nearest = alivePlayers[0];
  let minDist = Math.hypot(nearest.x-clickX, nearest.y-clickY);
  for(let p of alivePlayers){
    let d = Math.hypot(p.x-clickX, p.y-clickY);
    if(d<minDist){ nearest=p; minDist=d; }
  }

  nearest.targetX = clickX;
  nearest.targetY = clickY;
  moveInProgress = true;
});

// ====== AI MOVE ======
function aiMove(){
  moveInProgress=true;
  // AI: each alive circle moves towards nearest player with random offset
  for(let a of aiTeam.filter(a=>a.alive)){
    let alivePlayers = players.filter(p=>p.alive);
    if(alivePlayers.length===0) break;
    let target = alivePlayers[Math.floor(Math.random()*alivePlayers.length)];
    let offsetX = (Math.random()*40)-20;
    let offsetY = (Math.random()*40)-20;
    a.targetX = target.x+offsetX;
    a.targetY = target.y+offsetY;
  }
}

// ====== RESET GAME ======
function resetGame(){
  redScore=0;
  blueScore=0;
  updateScore();
  turn='player';
  players.forEach((p,i)=>{p.x=50+i*50; p.y=450; p.targetX=p.x; p.targetY=p.y; p.alive=true;});
  aiTeam.forEach((a,i)=>{a.x=50+i*50; a.y=50; a.targetX=a.x; a.targetY=a.y; a.alive=true;});
}

// ====== GAME LOOP ======
function gameLoop(){
  draw();
  animateMovement();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
